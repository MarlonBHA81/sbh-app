; Shutdown budget (audit CB-5)
; -----------------------------------------------------------------------------
; Previously nothing here set stopwaitsecs, so supervisord's 10s default applied
; and every deploy SIGKILLed in-flight work — including ffmpeg transcodes — even
; though Laravel's queue:work traps SIGTERM correctly.
;
; The chain that has to hold, outermost first:
;   compose stop_grace_period (150s)  >  stopwaitsecs (120s)  >  common job runtime
;   queue retry_after (660s)          >  queue:work --timeout (600s)
;
; The second line is the one that prevents duplicate processing: a job must not
; be redelivered while it is still running. The first line is best-effort — a
; genuinely long transcode still gets killed at 120s, but it is NOT lost, because
; an unacked job is redelivered after retry_after.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
; php-fpm treats TERM as an immediate stop and QUIT as a graceful one that lets
; in-flight requests finish. supervisord's default is TERM, so this must be set.
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
; --timeout caps a single job. Without it Laravel's 60s default applied, which
; killed ffmpeg transcodes mid-run and left media stuck in STATUS_PROCESSING.
command=php /app/artisan queue:work --tries=3 --backoff=3 --timeout=600 --max-time=3600
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=www-data
stopsignal=TERM
stopwaitsecs=120
; The worker spawns ffmpeg as a child. Without stopasgroup/killasgroup the
; signal reaches only the PHP process and ffmpeg is orphaned, keeping the CPU
; busy after the container is meant to be gone.
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /app/artisan schedule:work
autostart=true
autorestart=true
user=www-data
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
command=php /app/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=www-data
stopsignal=TERM
; Long enough to close websockets cleanly so clients reconnect rather than
; seeing an abrupt transport error.
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
