# Reverse proxy: API (php-fpm), websockets (Reverb), everything else -> Next.js.
# Replace example.com with your domain, then obtain certs:
#   docker compose -f docker-compose.prod.yml run --rm certbot certonly --webroot -w /var/www/certbot -d example.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Pin a modern TLS floor rather than relying on the base image defaults.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (`always` so they apply to error responses too). HSTS
    # enforces TLS after the first visit; nosniff blocks MIME-sniffing of user
    # media; frame-ancestors/X-Frame-Options prevent clickjacking.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m; # chunked uploads are 1MB; leave headroom

    # User media: served straight from the shared media-storage volume.
    # (^~ prefix match wins over the regex block below.)
    location ^~ /storage/ {
        alias /app/storage/app/public/;
        expires 7d;
        # A location with its own add_header does NOT inherit the server-level
        # ones, so re-assert nosniff on user-uploaded media here.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Laravel API + broadcasting auth. The fallback MUST be a named location:
    # a plain /index.php fallback re-runs location matching, no longer matches
    # this prefix set, and escapes into the Next.js proxy below.
    # js/css/fonts serve Filament's published admin assets from Laravel's
    # public dir (the Next.js app uses /_next/*, so no collision).
    location ~ ^/(api|broadcasting|sanctum|storage|admin|livewire|vendor|up|js|css|fonts)(/|$) {
        root /app/public;
        try_files $uri @laravel;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # TLS terminates here; without this Laravel assumes http and
        # generates insecure URLs / mis-flags session cookies.
        fastcgi_param HTTPS on;
    }

    # Next.js app
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Reverb websockets on :8080 (wss via the same certs)
server {
    listen 8080 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
    }
}
