# Production stack: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# (--env-file is required: the ${VARS} below are resolved by compose itself.)
# Copy .env.prod.example to .env.prod and fill in secrets first.
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # Only the MYSQL_* vars it needs (resolved from --env-file at compose time),
    # NOT the whole .env.prod — the DB container has no business holding APP_KEY,
    # provider API keys, SMTP or VAPID secrets.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sbh}
      MYSQL_USER: ${DB_USERNAME:-sbh}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ so the variable resolves inside the container, not at compose time.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Require a password when REDIS_PASSWORD is set (new deploys generate one);
    # unset → no auth, unchanged from before. Redis is internal-only (no ports).
    # `$$` defers expansion to the container shell so it reads the env var.
    command: sh -c 'redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    volumes:
      - redis-data:/data

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - media-storage:/app/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "9000" # php-fpm
      - "8080" # reverb

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL}
        NEXT_PUBLIC_REVERB_HOST: ${REVERB_PUBLIC_HOST}
        NEXT_PUBLIC_REVERB_PORT: "443"
        NEXT_PUBLIC_REVERB_SCHEME: https
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Reload every 6h so renewed certbot certificates are picked up without a
    # manual deploy (certbot writes to the shared cert volume but can't signal
    # this container). nginx stays PID 1 via exec, so a crash still restarts.
    command: sh -c "(while :; do sleep 6h; nginx -s reload 2>/dev/null; done) & exec nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api/public:/app/public:ro
      - media-storage:/app/storage/app:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api
      - web

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  mysql-data:
  redis-data:
  media-storage:
  certbot-certs:
  certbot-www:
