name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

# A newer push cancels an older in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo — never grant the default token write scope.
permissions:
  contents: read

jobs:
  api-tests:
    name: API (Pest, SQLite)
    runs-on: ubuntu-latest
    # Same-repo pushes and PRs both fire; the push run already covers this
    # branch, so skip the duplicate same-repo PR run (still run fork PRs, which
    # push CI can't cover).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, intl, mbstring, pdo_sqlite, redis, zip
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests
        run: php artisan test

  api-tests-mysql:
    name: API (Pest, MySQL 8)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    defaults:
      run:
        working-directory: apps/api
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sbh_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, intl, mbstring, pdo_mysql, redis, zip
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sbh_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan test

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json "packageManager" — specifying it here
      # too makes pnpm/action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Type check
        working-directory: apps/web
        run: pnpm exec tsc --noEmit
      - name: Build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build
      # Reuse the build artifact above for a lean Playwright smoke run (login
      # page renders; a private route redirects to sign-in). The Playwright
      # config boots `next start` itself, so no server needs starting here.
      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke (Playwright)
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
